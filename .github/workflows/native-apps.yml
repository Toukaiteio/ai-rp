name: Native apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_URL: https://rp.dys.asia/
  PROJECT: native/AiRp.Maui/AiRp.Maui.csproj

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui-windows
      - name: Publish Windows app
        run: dotnet publish $env:PROJECT -f net8.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained false -p:ApplicationUrl=$env:APP_URL -p:WindowsPackageType=None -o artifacts/windows
      - name: Create Windows archive
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/ai-rp-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ai-rp-windows
          path: artifacts/ai-rp-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: android-actions/setup-android@v3
      - name: Install MAUI workload
        run: dotnet workload install maui-android
      - name: Publish Android APK
        run: dotnet publish "$PROJECT" -f net8.0-android -c Release -p:ApplicationUrl="$APP_URL" -p:AndroidPackageFormat=apk -o artifacts/android
      - name: Select APK
        shell: bash
        run: cp "$(find artifacts/android -type f -name '*.apk' | head -n 1)" artifacts/ai-rp-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ai-rp-android
          path: artifacts/ai-rp-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ai-rp-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
